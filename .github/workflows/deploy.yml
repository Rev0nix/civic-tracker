name: Deploy and Release Lokify

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-and-release
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy Web to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: 'AIzaSyBfjn5u-jwEe8_FR_P2P_y8FbZItDFAowc'
          VITE_GOOGLE_MAPS_MAP_ID: '016089-E20F62-171E41'

      - name: Deploy to gh-pages branch (backup)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

  build-and-release-apk:
    name: Build Android APK & Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Node dependencies
        run: npm install

      - name: Build Web Bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: 'AIzaSyBfjn5u-jwEe8_FR_P2P_y8FbZItDFAowc'
          VITE_GOOGLE_MAPS_MAP_ID: '016089-E20F62-171E41'

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK Generated
        run: |
          ls -la android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.9' }}
          name: "Lokify ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.9' }} – Upgraded Android GIS Map, Dynamic Layer Switcher & Real Tile Rendering"
          make_latest: true
          body: |
            ## 📱 Lokify ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.9' }} – Android GIS Map Upgrade Release

            Official Android Mobile release of **Lokify**, the pure mobile municipal grievance redressal and spatial tracking platform.

            ### 🚀 Highlights & Fixes in v1.2.9:
            * **Fixed "API KEY REQUIRED" Map Bug:** Eliminated the dark grey background and repeated watermark by configuring OpenStreetMap standard raster tiles as the default street provider, with Esri World Imagery (Satellite), Esri Hybrid (Satellite with boundary/road labels), and Esri World Topo Map (Terrain).
            * **Interactive Map Layer Switcher:** Added a professional bottom sheet modal accessible from the GIS toolbar with 4 selectable layers (Standard Map, Satellite Imagery, Hybrid, Terrain), preview badges, and smooth switching.
            * **Floating GIS Control Panel:** Right-side controls including Compass / Reset Orientation, Map Layers selector, My Location GPS with radar pulse, and Zoom In / Out buttons.
            * **Comprehensive Issue Category Filters:** Horizontal filter bar featuring all categories (All, Active, Resolved, Potholes, Streetlights, Garbage, Water & Sewage, Drainage, Road Damage) with dynamic live count badges that filter markers in real time.
            * **Teardrop Issue Markers & Preview Cards:** Status-colored pins with category glyph emblems. Tapping any marker opens an interactive preview card displaying issue ID, category, status, relative reported date, address, and "View Full Issue Details" action.
            * **Reliable Location State Machine:** Enhanced location header with automatic timeout to prevent the indicator from being stuck on "Locating...", supporting `locating`, `found`, `permission_denied`, and `unavailable` states.

            ---

            ### 📲 Mobile App Download:
            Download the Android Debug APK below:
            - **[app-debug.apk](https://github.com/Rev0nix/civic-tracker/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.9' }}/app-debug.apk)**

            🌐 **Mobile Web App:** [https://rev0nix.github.io/civic-tracker](https://rev0nix.github.io/civic-tracker)
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
