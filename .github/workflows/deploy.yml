name: Deploy and Release Lokify

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    name: Build & Deploy Web to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

  build-and-release-apk:
    name: Build Android APK & Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-deploy]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Node dependencies
        run: npm install

      - name: Build Web Bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK Generated
        run: |
          ls -la android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.0' }}
          name: "Lokify v1.2.0 – Production Web & Mobile Release"
          body: |
            ## 🏛️ Lokify v1.2.0 – Production Release

            Welcome to the official production release of **Lokify**, the modern civic issue reporting and municipal tracking platform.

            ### 🚀 What's New:
            * **Expansive Website & Mobile Architecture:** Modern responsive web design with full desktop width (`max-w-7xl`), multi-column analytics, category filters, and a persistent website navigation header.
            * **Mandatory Dual Authentication Portal:** Distinct and dedicated portals for **Citizens** (Common People) and **Municipal Officials** (Government Administrators).
            * **Strict Credential Protection:**
              - Mandatory 10-digit mobile phone number validation with real-time format checks.
              - Standard RFC email address verification (e.g. Gmail).
              - 8+ character password validation with a live 4-tier visual strength meter.
            * **Real-Time Carrier SMS Gateway:** Instant SMS status dispatch to citizen mobile numbers upon report submission, status updates, and resolutions.
            * **Interactive Dark Google Map:** Custom dark-themed municipal GIS map with category/status pins, satellite toggle, and live GPS locking.
            * **Complete 5-Stage Status Timeline:** Visual progress tracker connecting `Open` ➔ `Acknowledged` ➔ `Assigned` ➔ `In Progress` ➔ `Resolved`.
            * **Municipal Official Admin Center:** Passcode-protected administrative controls for status updates, issue deletion, and one-click `.csv` spreadsheet export.
            * **Multilingual AI Assistant:** Floating civic guidance assistant supporting English and Kannada.

            ---

            ### 📲 Mobile App Download:
            Download the Android Debug APK below:
            - **[app-debug.apk](https://github.com/Rev0nix/civic-tracker/releases/download/v1.2.0/app-debug.apk)**

            🌐 **Live Web App:** [https://rev0nix.github.io/civic-tracker](https://rev0nix.github.io/civic-tracker)
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
