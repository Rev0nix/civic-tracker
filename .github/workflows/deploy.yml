name: Deploy and Release Lokify

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-and-release
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy Web to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: 'AIzaSyBfjn5u-jwEe8_FR_P2P_y8FbZItDFAowc'

      - name: Deploy to gh-pages branch (backup)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

  build-and-release-apk:
    name: Build Android APK & Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Node dependencies
        run: npm install

      - name: Build Web Bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: 'AIzaSyBfjn5u-jwEe8_FR_P2P_y8FbZItDFAowc'

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK Generated
        run: |
          ls -la android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.3' }}
          name: "Lokify ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.3' }} – Production Web & Mobile Release"
          make_latest: true
          body: |
            ## 🏛️ Lokify ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.3' }} – Production Release

            Welcome to the official production release of **Lokify**, the modern civic issue reporting and municipal tracking platform.

            ### 🚀 What's New in v1.2.3:
            * **Fixed Google Maps API Key Enforcement:** Ensured API key `AIzaSyBfjn5u-jwEe8_FR_P2P_y8FbZItDFAowc` is strictly bound into both CI builds and runtime, preventing override by Map/Billing IDs.
            * **Interactive Google Map Pin Picker in Report Issue Modal:** Drag and click anywhere on the map to pinpoint issue locations accurately with real-time reverse geocoded locality names.
            * **Mini Map Location Preview:** Issue detail view now embeds an interactive Google Map preview showing the issue marker with status-based dynamic coloring.
            * **Full Google Maps Platform Integration:** Replaced legacy OpenStreetMap with Google Maps JavaScript API, Google Geocoding API, and Android API Key configuration.
            * **CI/CD Reliability:** Fixed GitHub Actions concurrency conflicts, Gradle daemon stability, and upgraded GitHub Pages deployment with forced orphan branch sync.
            * **Expansive Website & Mobile Architecture:** Modern responsive web design with full desktop width (`max-w-7xl`), multi-column analytics, category filters, and a persistent website navigation header.
            * **Mandatory Dual Authentication Portal:** Distinct and dedicated portals for **Citizens** and **Municipal Officials**.
            * **Strict Credential Protection:** 10-digit phone verification, RFC email verification, and 8+ character password strength meter.
            * **Real-Time Carrier SMS Gateway:** Instant SMS status dispatch to citizen mobile numbers.
            * **Interactive Dark Google Map:** Custom dark-themed municipal GIS map with category/status pins, satellite toggle, and live GPS locking.
            * **Complete 5-Stage Status Timeline:** Visual progress tracker connecting `Open` ➔ `Acknowledged` ➔ `Assigned` ➔ `In Progress` ➔ `Resolved`.
            * **Municipal Official Admin Center:** Passcode-protected administrative controls for status updates, issue deletion, and one-click `.csv` spreadsheet export.
            * **Multilingual AI Assistant:** Floating civic guidance assistant supporting English and Kannada.

            ---

            ### 📲 Mobile App Download:
            Download the Android Debug APK below:
            - **[app-debug.apk](https://github.com/Rev0nix/civic-tracker/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.3' }}/app-debug.apk)**

            🌐 **Live Web App:** [https://rev0nix.github.io/civic-tracker](https://rev0nix.github.io/civic-tracker)
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
