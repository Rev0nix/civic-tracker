name: Deploy and Release Lokify

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-and-release
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy Web to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: 'AIzaSyBfjn5u-jwEe8_FR_P2P_y8FbZItDFAowc'
          VITE_GOOGLE_MAPS_MAP_ID: '016089-E20F62-171E41'

      - name: Deploy to gh-pages branch (backup)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

  build-and-release-apk:
    name: Build Android APK & Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Node dependencies
        run: npm install

      - name: Build Web Bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: 'AIzaSyBfjn5u-jwEe8_FR_P2P_y8FbZItDFAowc'
          VITE_GOOGLE_MAPS_MAP_ID: '016089-E20F62-171E41'

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK Generated
        run: |
          ls -la android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.3.0' }}
          name: "Lokify ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.3.0' }} – Zero-Auth GIS Map, Guaranteed Control Layering & Multi-CDN Fallback"
          make_latest: true
          body: |
            ## 📱 Lokify ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.3.0' }} – Permanent Map Fix & Guaranteed Controls Release

            Official Android Mobile release of **Lokify**, the pure mobile municipal grievance redressal and spatial tracking platform.

            ### 🚀 Highlights & Fixes in v1.3.0:
            * **Complete Removal of Google Maps & Carto Dependency:** Permanently eliminated any invocation of Google Maps SDK or Carto raster tiles across the main map, Report Issue modal, and Issue Detail modal. The app now runs 100% on high-performance Leaflet GIS with OpenStreetMap (multi-subdomain `a/b/c`) and automated fallback to Esri World Street Map, Esri World Imagery (Satellite), Esri Hybrid, and Esri Topographic maps.
            * **Fixed Disappearing Controls (Z-Index Overhaul):** Elevated all GIS floating controls, layer switchers, preview cards, and category filter bars to `z-[1000]` - `z-[1002]`, ensuring they are never obscured by Leaflet tile panes or map overlays.
            * **Instant Map Rendering:** Added multiple staggered `invalidateSize()` invocations and mobile flex container safeguards (`min-h-0`) so the map fills the screen instantly when opened with zero layout lag.
            * **Interactive GIS Controls:** Fully functional Compass / Reset View, Layer Switcher bottom sheet, GPS live location tracking, Zoom In (+), Zoom Out (-), and live category counts across all 9 filters.
            * **Interactive Pin Selection:** Custom category-emblem pins with status colors that open issue previews with "View Full Issue Details" action.

            ---

            ### 📲 Mobile App Download:
            Download the Android Debug APK below:
            - **[app-debug.apk](https://github.com/Rev0nix/civic-tracker/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.3.0' }}/app-debug.apk)**

            🌐 **Mobile Web App:** [https://rev0nix.github.io/civic-tracker](https://rev0nix.github.io/civic-tracker)
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
